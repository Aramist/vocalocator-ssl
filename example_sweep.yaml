command:
- ${env}
- ${interpreter}
- -m
- vocalocatorssl
- --config
- ${args_json_file}
- --sweep
method: bayes
metric:
  goal: maximize
  name: uncalibrated_prop_assignable
parameters:
  optimization:
    parameters:
      num_weight_updates:
        distribution: constant
        value: 150000
      momentum:
        distribution: constant
        value: 0.8
      initial_learning_rate:
        distribution: log_uniform_values
        min: 1e-4
        max: 1e-1
  architecture:
    distribution: constant
    value: conformer
  model_params:
    parameters:
      resnet_num_blocks:
        distribution: constant
        value: 4
      resnet_conv_channels:
        distribution: constant
        value: 64
      d_embedding:
        distribution: categorical
        values: [32, 64]
      conformer_num_layers:
        distribution: constant
        value: 2
  dataloader:
    parameters:
      num_negative_samples:
        distribution: int_uniform
        min: 1
        max: 63
  augmentations:
    parameters:
      mask_channels_min_channels:
        distribution: constant
        value: 6
      mask_channels_max_channels:
        distribution: constant
        value: 12

program: __main__.py
run_cap: 100
